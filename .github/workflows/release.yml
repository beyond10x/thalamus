name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.99.0

      - name: Check the release tag and its CHANGELOG section
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "thalamus-cli") | .version')
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::no thalamus-cli version in Cargo.toml" >&2
            exit 1
          fi
          tag="${RELEASE_TAG:-v$version}"
          if [ "$EVENT_NAME" = release ]; then
            cargo run --locked -p thalamus-docs -- release-check --tag "$tag"
          else
            cargo run --locked -p thalamus-docs -- release-check --tag "v$version" || echo "::warning::dry build: release-check refused v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked -p thalamus-cli

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin="target/release/thalamus"
          printed=$("$bin" --version)
          if [ "$printed" != "thalamus $VERSION" ]; then
            echo "::error::the built binary prints '$printed', expected 'thalamus $VERSION'" >&2
            exit 1
          fi
          name="thalamus-$VERSION-$TARGET"
          dist="$RUNNER_TEMP/dist"
          epoch=$(git log -1 --format=%ct)
          rm -rf "$dist"
          mkdir -p "$dist/$name"
          cp "$bin" LICENSE README.md "$dist/$name/"
          tar -C "$dist" --format=gnu --sort=name --mtime="@$epoch" \
            --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX,a-s' \
            -cf - "$name" | gzip -n -9 > "$dist/$name.tar.gz"
          rm -rf "${dist:?}/$name"
          cd "$dist"
          sha256sum "$name.tar.gz" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thalamus-${{ steps.version.outputs.version }}-${{ env.TARGET }}
          path: |
            ${{ runner.temp }}/dist/thalamus-${{ steps.version.outputs.version }}-${{ env.TARGET }}.tar.gz
            ${{ runner.temp }}/dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Attach the assets to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a prerelease or a tag that is not on main
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$PRERELEASE" != false ]; then
            echo "::error::release $RELEASE_TAG is a prerelease (prerelease=$PRERELEASE); assets are attached only to a full release" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main is not in the checkout; cannot check that $RELEASE_TAG is on main" >&2
            exit 1
          fi
          if ! commit=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}"); then
            echo "::error::the tag $RELEASE_TAG is not in the checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::the tag $RELEASE_TAG ($commit) is not on origin/main; release only a commit merged to main" >&2
            exit 1
          fi
          echo "$RELEASE_TAG ($commit) is a full release on origin/main"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thalamus-${{ needs.build.outputs.version }}-${{ env.TARGET }}
          path: ${{ runner.temp }}/dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          name="thalamus-$VERSION-$TARGET"
          (cd "$dist" && sha256sum --check --strict SHA256SUMS)
          gh release upload "$RELEASE_TAG" "$dist/$name.tar.gz" "$dist/SHA256SUMS" --repo "$GITHUB_REPOSITORY"
