id: gate.ci.colour
title: The colour a build gate printed, from a database
family: gate
kind: gauge
unit: "{verdict}"
dimensions: []
source: { adapter: sql, connection: reports-replica }
extractor: sql.value
query: { value: "SELECT colour AS value FROM gate_runs" }
window: PT1H
cadence: PT1H
history: store
denominator: { unit: "{run}", min_n: 0, since: 2026-01-01T00:00:00Z }
evaluation:
  rule: producer_mapped
  baselines: [fixed]
  fixed: "0"
  mapping: { green: OK, yellow: WARN, red: CRIT, na: UNKNOWN }
owner: team:gate
lifecycle: active
rev: 1
revised_at: 2026-10-01T00:00:00Z
revised_by: operator
