id: service.api.failure_ratio
title: Share of requests the service failed, from metrics
family: service
kind: ratio
unit: "1"
dimensions: []
source: { adapter: metrics, connection: metrics-main }
extractor: promql.ratio
query:
  numerator: sum(increase(requests_failed_total[1h]))
  denominator: sum(increase(requests_total[1h]))
window: PT1H
cadence: PT1H
history: store
denominator: { unit: "{request}", min_n: 20, since: first_sample }
evaluation:
  rule: higher_is_worse
  baselines: [fixed]
  fixed: "0"
  warn: { abs: "0.02" }
  crit: { abs: "0.05" }
owner: team:service
lifecycle: active
rev: 1
revised_at: 2026-10-01T00:00:00Z
revised_by: operator
