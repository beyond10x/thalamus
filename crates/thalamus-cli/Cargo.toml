[package]
name = "thalamus-cli"
description = "The thalamus command line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thalamus"
path = "src/main.rs"

[dependencies]
thalamus-core = { path = "../thalamus-core" }
thalamus-store = { path = "../thalamus-store" }
thalamus-sources = { path = "../thalamus-sources" }
thalamus-pipeline = { path = "../thalamus-pipeline" }
thalamus-model = { package = "thalamus", path = "../../generated/thalamus-model" }
thalamus-spec-types = { path = "../../generated/spec-types" }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
