[package]
name = "thalamus-cli"
description = "The thalamus command line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thalamus"
path = "src/main.rs"

[dependencies]
thalamus-core = { path = "../thalamus-core" }
thalamus-store = { path = "../thalamus-store" }
thalamus-sources = { path = "../thalamus-sources" }
thalamus-pipeline = { path = "../thalamus-pipeline" }
thalamus-model = { package = "thalamus", path = "../../generated/thalamus-model" }
thalamus-spec-types = { path = "../../generated/spec-types" }
clap = { version = "4.6", features = ["derive", "env"] }
serde_json = "1"
time = { version = "=0.3.45", features = ["formatting", "parsing"] }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.0" }
tokio-postgres = "0.7"

[lints]
workspace = true
