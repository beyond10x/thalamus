id: service.queue.depth
title: Messages waiting in the work queue
family: service
kind: gauge
unit: "{message}"
dimensions: []
source: { adapter: metrics, connection: metrics-main }
extractor: promql.value
query: { value: sum(queue_depth) }
window: PT5M
cadence: PT5M
history: store
denominator: { unit: "{message}", min_n: 0, since: 2026-01-01T00:00:00Z }
evaluation:
  rule: higher_is_worse
  baselines: [fixed]
  fixed: "0"
  warn: { abs: "100" }
  crit: { abs: "1000" }
owner: team:service
lifecycle: active
rev: 1
revised_at: 2026-10-02T00:00:00Z
revised_by: operator
