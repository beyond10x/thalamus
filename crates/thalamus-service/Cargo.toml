[package]
name = "thalamus-service"
description = "The scheduler, the HTTP API, the evaluation stream and the CloudEvents emitter."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thalamus-core = { path = "../thalamus-core" }
thalamus-store = { path = "../thalamus-store" }
thalamus-sources = { path = "../thalamus-sources" }
thalamus-pipeline = { path = "../thalamus-pipeline" }
thalamus-model = { package = "thalamus", path = "../../generated/thalamus-model" }
thalamus-spec-types = { path = "../../generated/spec-types" }
clap = { version = "4.6", features = ["derive", "env"] }
time = { version = "=0.3.45", features = ["formatting", "parsing"] }
serde_json = "1"

[dev-dependencies]

[lints]
workspace = true
