[package]
name = "thalamus-sources"
description = "Adapters that turn a Connectors operation into samples."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "connectors-double"
path = "src/bin/connectors-double.rs"

[dependencies]
thalamus-core = { path = "../thalamus-core" }
thalamus-model = { package = "thalamus", path = "../../generated/thalamus-model" }
thalamus-spec-types = { path = "../../generated/spec-types" }
serde_json = "1.0.151"
sha2 = "0.10"
time = { version = "0.3.45", features = ["formatting", "parsing"] }

[lints]
workspace = true
