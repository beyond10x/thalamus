[package]
name = "thalamus-core"
description = "Definitions, baselines, the verdict ladder, hysteresis and rollups; no I/O and no clock."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
conformance = ["thalamus-model/server"]

[dependencies]
thalamus-model = { package = "thalamus", path = "../../generated/thalamus-model" }
thalamus-spec-types = { path = "../../generated/spec-types" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
time = { version = "=0.3.45", features = ["formatting", "parsing"] }

[dev-dependencies]
thalamus-core = { path = ".", features = ["conformance"] }
serde_json = "1"

[lints]
workspace = true
