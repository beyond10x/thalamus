version: '3'

vars:
  CARGO: 'env CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4 nice -n 19 cargo'
  ESS: ess
  POSTGRES_IMAGE: 'postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94'
  CRATES: '-p thalamus-core -p thalamus-store -p thalamus-sources -p thalamus-pipeline -p thalamus-service -p thalamus-cli -p thalamus-docs'

tasks:
  generate:
    desc: Regenerate everything under generated/ and spec/suite.json from spec/
    cmds:
      - rm -rf generated/thalamus-model generated/spec-types
      - '{{.ESS}} specify validate --path spec --strict-requires'
      - '{{.ESS}} generate synthesize --path spec --target rust --layout crate --out generated/thalamus-model --strict-requires'
      - '{{.ESS}} generate types --path spec --target rust --all-types --all-events --package thalamus-spec-types --out generated/spec-types --strict-requires'
      - '{{.ESS}} verify conform synthesize --path spec --out spec/suite.json --strict-requires'

  drift:
    desc: Fail when generated/ or spec/suite.json differ from what spec/ generates
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d "${TMPDIR:-$HOME/.cache}/thalamus-drift.XXXXXX")
        trap 'rm -rf "$tmp"' EXIT
        mkdir -p "$tmp/generated"
        {{.ESS}} generate synthesize --path spec --target rust --layout crate --out "$tmp/generated/thalamus-model" --strict-requires >/dev/null
        {{.ESS}} generate types --path spec --target rust --all-types --all-events --package thalamus-spec-types --out "$tmp/generated/spec-types" --strict-requires >/dev/null
        if ! {{.ESS}} verify conform synthesize --path spec --out "$tmp/suite.json" --strict-requires >/dev/null 2>"$tmp/conform.err"; then
          cat "$tmp/conform.err" >&2
          exit 1
        fi
        diff -r --exclude=.ess-output generated "$tmp/generated"
        cmp spec/suite.json "$tmp/suite.json"
        echo "generated/ and spec/suite.json match spec/"

  build:
    desc: Build the thalamus binaries
    cmds:
      - '{{.CARGO}} build --locked --release'

  test:
    desc: Run every test; the store's on SQLite and on PostgreSQL (task test-postgres)
    cmds:
      - '{{.CARGO}} test --locked --workspace --exclude thalamus-store'
      - task: test-postgres

  test-postgres:
    desc: Run the store tests on SQLite and PostgreSQL, in the database THALAMUS_TEST_POSTGRES_URL names or else in a disposable PostgreSQL 17 container
    cmds:
      - |
        set -eu
        if [ -n "${THALAMUS_TEST_POSTGRES_URL:-}" ]; then
          exec {{.CARGO}} test --locked -p thalamus-store
        fi
        name="thalamus-test-postgres-$$-$(date +%s)"
        id=$(docker run --detach --rm --name "$name" \
          --env POSTGRES_HOST_AUTH_METHOD=trust --publish 127.0.0.1::5432 \
          --cpus 2 --memory 1g --pids-limit 256 {{.POSTGRES_IMAGE}})
        trap 'docker rm --force "$id" >/dev/null' EXIT
        ready=no
        for _ in $(seq 1 120); do
          if docker exec "$id" pg_isready --quiet --username postgres --host 127.0.0.1; then
            ready=yes
            break
          fi
          sleep 1
        done
        if [ "$ready" != yes ]; then
          echo "PostgreSQL container $name did not accept connections" >&2
          exit 1
        fi
        port=$(docker port "$id" 5432/tcp | head -n 1 | sed 's/.*://')
        THALAMUS_TEST_POSTGRES_URL="postgresql://postgres@127.0.0.1:$port/postgres" \
          {{.CARGO}} test --locked -p thalamus-store

  check:
    desc: The gate — spec validity, generated-code drift, fmt, clippy, tests, documentation drift
    cmds:
      - '{{.ESS}} specify validate --path spec --strict-requires'
      - task: drift
      - '{{.CARGO}} fmt {{.CRATES}} -- --check'
      - task: docs-check
      - '{{.CARGO}} clippy --locked --workspace --all-targets -- -D warnings'
      - task: test

  docs-generate:
    desc: Regenerate the derived documentation files under website/
    cmds:
      - '{{.CARGO}} run --locked -p thalamus-docs -- generate --ess {{.ESS}}'

  docs-check:
    desc: Fail when a generated documentation file is missing, stale or edited by hand
    cmds:
      - '{{.CARGO}} run --locked -p thalamus-docs -- generate --check --ess {{.ESS}}'

  website:
    desc: Build the documentation site, as CI's Documentation validation workflow does
    dir: website
    cmds:
      - npm ci --allow-git=root
      - npm run build
